name: finance_tracker
description: SweldoTrack by Intellium Digital

publish_to: 'none'

version: 10.0.0+10

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  in_app_purchase: ^3.2.3
  http: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/sweldotrack_icon.png"
  adaptive_icon_background: "#050816"
  adaptive_icon_foreground: "assets/icon/sweldotrack_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/onboarding_bills.png
    - assets/images/onboarding_budget.png
    - assets/images/onboarding_expenses.png
    - assets/images/onboarding_premium.png
    - assets/images/onboarding_income.png
    - assets/images/onboarding_dashboard.png
    - assets/images/setup_profile.png
    - assets/icon/sweldotrack_icon.png
